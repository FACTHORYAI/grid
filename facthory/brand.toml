# Facthory Grid: upstream GridCraft (storytold/gridcraft) under the Facthory brand.
# Applied to a fresh checkout by facthory/rebrand.py before every build; the tracked tree stays
# upstream's so releases merge cleanly. Order and semantics: the docstring of rebrand.py.

[brand]
name = "Facthory Grid"
app_id = "com.facthory.grid"
publisher = "Bandpey GmbH"
website = "https://facthory.com/grid"
repository = "https://github.com/FACTHORYAI/grid"
support = "https://github.com/FACTHORYAI/grid/issues"

[upstream]
name = "GridCraft"
team = "ArtCraft team"
repository = "https://github.com/storytold/gridcraft"

[icon]
# The glyph is grid.svg, unchanged; facthory/icons/fit.py places it: grid-macos.svg (Apple's grid) and
# grid-flat.svg (Windows, Linux, the scalable icon). render.py renders the platform files from those.
glyph = "grid.svg"
svg = "grid-flat.svg"
base = "facthorygrid"
macos_svg = "grid-macos.svg"
author = "with icons contributors; recoloured by Bandpey GmbH"
source = "`table` in with icons' Chrome style (https://github.com/withevergrow/withicons at 996cc78), recoloured to the Grid colours"
licence = "MIT"
# The licence text, written at the end of ATTRIBUTION.md's Facthory block (which ships).
notice = "LICENSE-withicons.txt"
note = """Facthory's marks (`facthory/icons/brand/`, and the two renders of them in `app-icon/` that the About box draws) are the brand of Bandpey GmbH, copied unmodified from the Facthory Design System. They are not open source and not covered by this project's MIT OR Apache-2.0 licence: they may be used unmodified only, to name Facthory's own builds, and a logo is never recoloured, stretched, cropped or redrawn. They are not in the app icons."""

# Facthory's other asset files, credited in ATTRIBUTION.md's Facthory block (render.py).
[[asset]]
path = "dmg/background.svg"
author = "@XusBadia (GridCraft contributors); recoloured and retitled by Bandpey GmbH"
source = "derived from GridCraft's `packaging/macos/dmg/background.svg`; title outlined from Inter SemiBold (OFL-1.1)"
licence = "MIT OR Apache-2.0"

[[asset]]
path = "icons/brand/mark.svg"
author = "Bandpey GmbH"
source = "Facthory's logo (the mark, for light grounds), copied unmodified from the Facthory Design System"
licence = "Facthory trademark, all rights reserved: not open source; usable unmodified only"

[[asset]]
path = "icons/brand/mark-mono.svg"
author = "Bandpey GmbH"
source = "Facthory's logo (the mark in white and greys, for dark grounds), copied unmodified from the Facthory Design System"
licence = "Facthory trademark, all rights reserved: not open source; usable unmodified only"

[[asset]]
path = "icons/brand/mark.png"
author = "Bandpey GmbH"
source = "Facthory's logo (the mark, 960 x 1016 pixels), copied unmodified from the Facthory Design System"
licence = "Facthory trademark, all rights reserved: not open source; usable unmodified only"

[[asset]]
path = "icons/brand/word-mark.svg"
author = "Bandpey GmbH"
source = "Facthory's logo (the mark beside the name), copied unmodified from the Facthory Design System"
licence = "Facthory trademark, all rights reserved: not open source; usable unmodified only"

[[asset]]
path = "icons/brand/word-mark-only.svg"
author = "Bandpey GmbH"
source = "Facthory's logo (the lettering alone), copied unmodified from the Facthory Design System"
licence = "Facthory trademark, all rights reserved: not open source; usable unmodified only"

[[asset]]
path = "icons/brand/word-mark-only-mono.svg"
author = "Bandpey GmbH"
source = "Facthory's logo (the lettering alone, for dark grounds), copied unmodified from the Facthory Design System"
licence = "Facthory trademark, all rights reserved: not open source; usable unmodified only"

[[asset]]
path = "icons/proof/grid.png"
author = "Bandpey GmbH"
source = "contact sheet of the icon candidates beside reference shapes, drawn by `facthory/icons/proof.py`; contains Facthory's mark"
licence = "MIT OR Apache-2.0, except Facthory's mark in it: trademark of Bandpey GmbH"

[files]
# Never touched: upstream's licences and notices stay exactly as written (Apache-2.0 §4).
skip = ["LICENSE-APACHE", "LICENSE-MIT", "NOTICE", ".github"]
# Credit files: only tokens marked credits = true (ids, paths, URLs) apply, so upstream's authors
# keep their credit while the paths they name follow the renames.
credits = ["ATTRIBUTION.md", "contributors"]
# The ArtCraft marks, licensed only for unmodified GridCraft (docs/brand/LICENSE-brand.txt).
delete = ["docs/brand"]

# ---------------------------------------------------------------------------------------------
# Rules before the tokens, on upstream's text. Each fails the build when upstream moves it.

[[rule]]
why = "ProgIDs, the AppDir and other dotted names cannot take the space in the display name"
files = ["packaging/*", "apps/*"]
find = 'GridCraft\.(?=[A-Z])'
replace = 'FacthoryGrid.'
regex = true

[[rule]]
why = "The ArtCraft Discord becomes our issue tracker: About link"
files = "crates/ui-egui/src/dialogs/about.rs"
find = 'ui.hyperlink_to("Join the ArtCraft Discord", "https://discord.gg/artcraft");'
replace = 'ui.hyperlink_to("Report a problem on GitHub", "https://discord.gg/artcraft");'
count = 1

[[rule]]
why = "Its translations: the new label, shown in English until translated"
files = "crates/ui-egui/src/i18n/*.rs"
find = '"Join the ArtCraft Discord"(\s*(?:=>|,)\s*)"[^"]*"'
replace = '"Report a problem on GitHub"\1"Report a problem on GitHub"'
regex = true
count = 7

[[rule]]
why = "macOS Help menu: the Discord item"
files = "apps/gridcraft/src/native_menu.rs"
find = '("Join the ArtCraft Discord…", "url:https://discord.gg/artcraft", None)'
replace = '("Report a Problem on GitHub…", "url:https://discord.gg/artcraft", None)'
count = 1

[[rule]]
why = "macOS: the CLI goes inside the app, beside the app's own executable, so a Facthory agent finds the MCP server where the app is installed (W5); the Windows and Linux installers already carry it"
files = "packaging/macos/package.sh"
find = '''
cp "$WORK/bin/gridcraft" "$APP/Contents/MacOS/GridCraft"
'''
replace = '''
cp "$WORK/bin/gridcraft" "$APP/Contents/MacOS/GridCraft"
cp "$WORK/bin/gridcraft-cli" "$APP/Contents/MacOS/gridcraft-cli"
'''
count = 1

[[rule]]
why = "... signed with the hardened runtime before the bundle, as nested code is"
files = "packaging/macos/package.sh"
find = '''
sign --options runtime --entitlements "$HERE/entitlements.plist" "$APP/Contents/MacOS/GridCraft"
'''
replace = '''
sign --options runtime "$APP/Contents/MacOS/gridcraft-cli"
sign --options runtime --entitlements "$HERE/entitlements.plist" "$APP/Contents/MacOS/GridCraft"
'''
count = 1

[[rule]]
why = "Windows: the installer's suite folder (Programs\\ArtCraft\\<app>, Program Files\\ArtCraft\\<app>) is ours, and the installer's own policy check expects the same name"
files = ["packaging/windows/*.wxs", "packaging/windows/*.wxi", "packaging/windows/*.ps1", "packaging/windows/*.md"]
find = "ArtCraft"
replace = "Facthory"

# Windows signing runs in CI only, through GitHub's OIDC token (the owner's rule, 2026-10-31): the
# release workflow signs in to Azure with azure/login, so no client secret exists anywhere, and
# Artifact Signing's library takes that sign-in from the Azure CLI. facthory-release.yml says so
# with AZURE_SIGNING_OIDC=1; without it, upstream's paths are unchanged.

[[rule]]
why = "Windows signing through OIDC: Artifact Signing needs only its endpoint, account and profile"
files = "packaging/windows/sign.ps1"
find = """
$azureVars = 'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET', 'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_CERT_PROFILE'
"""
replace = """
$azureVars = 'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET', 'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_CERT_PROFILE'
if ($env:AZURE_SIGNING_OIDC -eq '1') { $azureVars = 'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_CERT_PROFILE' }
"""
count = 1

[[rule]]
why = "... and the signing library tries the Azure CLI's sign-in alone, not the runner's other identities"
files = "packaging/windows/sign.ps1"
find = """
    } | ConvertTo-Json | Set-Content -Path $metadata -Encoding utf8
"""
replace = """
    } | ForEach-Object {
      if ($env:AZURE_SIGNING_OIDC -eq '1') {
        $_.ExcludeCredentials = @('EnvironmentCredential', 'WorkloadIdentityCredential', 'ManagedIdentityCredential', 'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential', 'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential')
      }
      $_
    } | ConvertTo-Json | Set-Content -Path $metadata -Encoding utf8
"""
count = 1

# The Flatpak recipes name the shared updater's version folder under the ArtCraft name; our builds
# leave that updater out (craft-update, above), so the folder goes. The update permissions stay:
# upstream's test requires them (crates/ui-egui/tests/flatpak_updates.rs) and they name nobody.
[[rule]]
why = "The Flatpak recipes drop the shared updater's ArtCraft folder"
files = ["packaging/linux/flatpak/ai.storyteller.gridcraft.yml", "packaging/linux/flatpak/ai.storyteller.gridcraft.bundle.yml"]
find = "  - --filesystem=xdg-data/ArtCraft/versions:ro\n"
replace = ""
count = 2

[[rule]]
why = "The Flatpak image push names a fallback user: ours"
files = "packaging/linux/flatpak-oci.sh"
find = "${GITHUB_ACTOR:-storytold}"
replace = "${GITHUB_ACTOR:-facthory}"
count = 1

# Notarization with the App Store Connect API key of Bandpey GmbH's other releases, not an Apple
# account's app-specific password: package.sh reads the key's file, id and issuer (the release
# workflow writes the .p8 under $RUNNER_TEMP, mode 600, and removes it again).
[[rule]]
why = "Notarization takes an API key: the script's header"
files = "packaging/macos/package.sh"
find = '''# Notarization (env; all three needed, and a real identity):
#   APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID
'''
replace = '''# Notarization (env; all three needed, and a real identity), with an App Store Connect API key:
#   NOTARY_KEY_FILE (the .p8), NOTARY_KEY_ID, NOTARY_ISSUER
'''
count = 1

[[rule]]
why = "... the condition"
files = "packaging/macos/package.sh"
find = '''elif [[ -n "${APPLE_ID:-}" ]] && [[ -n "${APPLE_PASSWORD:-}" ]] && [[ -n "${APPLE_TEAM_ID:-}" ]]; then
  NOTARIZE=1
else
  warn "macOS: APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID incomplete; signed but not notarized"
fi
'''
replace = '''elif [[ -f "${NOTARY_KEY_FILE:-}" ]] && [[ -n "${NOTARY_KEY_ID:-}" ]] && [[ -n "${NOTARY_ISSUER:-}" ]]; then
  NOTARIZE=1
else
  warn "macOS: NOTARY_KEY_FILE / NOTARY_KEY_ID / NOTARY_ISSUER incomplete; signed but not notarized"
fi
'''
count = 1

[[rule]]
why = "... the submission"
files = "packaging/macos/package.sh"
find = '''  out="$(xcrun notarytool submit "$file" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
    --team-id "$APPLE_TEAM_ID" --wait --timeout 1h --output-format json)" || true
'''
replace = '''  out="$(xcrun notarytool submit "$file" --key "$NOTARY_KEY_FILE" --key-id "$NOTARY_KEY_ID" \
    --issuer "$NOTARY_ISSUER" --wait --timeout 1h --output-format json)" || true
'''
count = 1

[[rule]]
why = "... and the log of a refusal"
files = "packaging/macos/package.sh"
find = '''      xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
'''
replace = '''      xcrun notarytool log "$id" --key "$NOTARY_KEY_FILE" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" || true
'''
count = 1

# Upstream's own updater (craft-update, from craft-libs) checks and installs the upstream apps'
# releases, by their repositories and ai.storyteller.* ids, and carries their names into the binary.
# It is left out: facthory/update/ is the updater that runs, and facthory/update/updates_ui.rs
# stands in for upstream's update window ([[copy]] below).

[[rule]]
why = "No self-update helper of upstream's flow at start"
files = "apps/gridcraft/src/main.rs"
find = "    // The restart helper a self-update spawns: it finishes the swap and relaunches, then exits.\n    if let Some(done) = craft_update::self_update::finish(&gridcraft_ui_egui::UPDATE_APP, &std::env::args_os().skip(1).collect::<Vec<_>>()) {\n        if let Err(e) = done {\n            eprintln!(\"GridCraft update helper failed: {e}\");\n            std::process::exit(1);\n        }\n        return Ok(());\n    }\n"
replace = ""
count = 1

[[rule]]
why = "... nor upstream's description of its app for craft-update"
files = "crates/ui-egui/src/lib.rs"
find = '''(?s)/// GridCraft as craft-update knows it.*?\n};\n\n'''
replace = ""
regex = true
count = 1

[[rule]]
why = "... and no craft-update dependency"
files = ["apps/gridcraft/Cargo.toml", "crates/ui-egui/Cargo.toml"]
find = "craft-update = { workspace = true }\n"
replace = ""
count = 2

[[rule]]
why = "... in the workspace either"
files = "Cargo.toml"
find = '^craft-update = \{ git = "https://github.com/storytold/craft-libs".*\n'
replace = ""
regex = true
count = 1

# ---------------------------------------------------------------------------------------------
# Tokens, in order, over every text file. credits = true: also in the credit files.

[[token]]
from = "ai.storyteller.gridcraft"
to = "com.facthory.grid"
credits = true

[[token]]
from = "ai.storyteller"
to = "com.facthory"
credits = true

[[token]]
from = "gridcraft@storyteller.ai"
to = "support@facthory.com"

[[token]]
from = "https://getartcraft.com/apps/gridcraft"
to = "https://facthory.com/grid"
credits = true

[[token]]
from = "getartcraft.com/apps/gridcraft"
to = "facthory.com/grid"
credits = true

# The rest of upstream's site (the Help menu's "GridCraft on getartcraft.com").
[[token]]
from = "getartcraft.com"
to = "facthory.com"

[[token]]
from = "https://discord.gg/artcraft"
to = "https://github.com/FACTHORYAI/grid/issues"

[[token]]
from = "discord.gg/artcraft"
to = "github.com/FACTHORYAI/grid/issues"

[[token]]
from = "github.com/storytold/gridcraft"
to = "github.com/FACTHORYAI/grid"

[[token]]
from = "storytold/gridcraft"
to = "FACTHORYAI/grid"

[[token]]
from = "Learning Machines LLC"
to = "Bandpey GmbH"

[[token]]
from = "GRIDCRAFT"
to = "FACTHORY_GRID"

[[token]]
from = "GridCraft"
to = "Facthory Grid"

[[token]]
from = "Gridcraft"
to = "FacthoryGrid"

# Crate, binary, file and directory names: one lowercase word, so Rust identifiers
# (gridcraft_engine -> facthorygrid_engine), module paths and log targets stay consistent.
[[token]]
from = "gridcraft"
to = "facthorygrid"
credits = true

# ---------------------------------------------------------------------------------------------
# Windows Installer: our own UpgradeCode and component GUIDs, stable across releases.

[guids]
namespace = "https://facthory.com/grid/windows-installer"
# The installer's own policy check records the upgrade identity: the same GUIDs, mapped alike.
files = ["packaging/windows/*.wxs", "packaging/windows/install-policy.json"]

# ---------------------------------------------------------------------------------------------
# Rules after the tokens and renames: the credits, which name upstream on purpose.

[[rule]]
phase = "after"
why = "About: who makes it and what it is based on (brand licence: plain-text credit allowed)"
files = "crates/ui-egui/src/dialogs/about.rs"
find = 'ui.label("A clean-room, open-source, Rust-native spreadsheet. Part of ArtCraft.");'
replace = 'ui.label("A free, open-source spreadsheet from Facthory. Based on GridCraft by the ArtCraft team.");'
count = 1

[[rule]]
phase = "after"
why = "About: our copyright, then upstream's, which the licence requires us to keep"
files = "crates/ui-egui/src/dialogs/about.rs"
find = '''
            ui.hyperlink_to("Report a problem on GitHub", "https://github.com/FACTHORYAI/grid/issues");
'''
replace = '''
            ui.hyperlink_to("Report a problem on GitHub", "https://github.com/FACTHORYAI/grid/issues");
            ui.add_space(4.0);
            ui.weak("MIT OR Apache-2.0. Copyright (c) 2026 Bandpey GmbH. Based on GridCraft, copyright (c) 2026 ArtCraft Team and the GridCraft contributors.");
'''
count = 1

[[rule]]
phase = "after"
why = "Windows file properties: our copyright and upstream's"
files = "apps/facthorygrid/build.rs"
find = '"Copyright (c) the Facthory Grid authors. MIT OR Apache-2.0."'
replace = '"Copyright (c) Bandpey GmbH; based on GridCraft, copyright (c) the GridCraft authors. MIT OR Apache-2.0."'
count = 1

[[rule]]
phase = "after"
why = "The app icon is ours (derived from with icons, MIT); its attribution rows say so"
files = "ATTRIBUTION.md"
find = '^(\| `assets/app-icon/(?!facthory[a-z]+-logo-)[^`]+\.(?:svg|png|ico|icns)` \|).*$'
replace = '\1 with icons contributors; recoloured by Bandpey GmbH | `table` from with icons (Chrome style), recoloured (`facthory/icons/grid.svg`; on a tile for macOS, `facthory/icons/grid-macos.svg`), rendered by `facthory/icons/render.py` | MIT | Facthory Grid app icon |'
regex = true
count = 14

[[rule]]
phase = "after"
why = "Upstream's icon README and icon licence go with upstream's icon (the copy below replaces the folder)"
files = "ATTRIBUTION.md"
find = '^\| `assets/app-icon/(?:README\.md|LICENSE\.txt)` \|.*\n'
replace = ''
regex = true
count = 2

# Facthory's mark in the About box (facthory/ui/facthory_logo.rs, copied below), which upstream's
# shows as text only: its module, and one call before the app's name.
[[rule]]
phase = "after"
why = "The About box's logo: its module"
files = "crates/ui-egui/src/lib.rs"
find = "mod updates_ui;\n"
replace = "mod updates_ui;\nmod facthory_logo;\n"
count = 1

[[rule]]
phase = "after"
why = "The About box's logo: drawn above the name, the mark of the window's theme"
files = "crates/ui-egui/src/dialogs/about.rs"
find = "        _ => {\n            ui.heading(\"Facthory Grid\");\n"
replace = "        _ => {\n            crate::facthory_logo::show(ui);\n            ui.heading(\"Facthory Grid\");\n"
count = 1

# The updater (facthory/update/facthory_update.rs, copied below): its module and its calls from
# main.rs. It needs no dependency the app lacks.
[[rule]]
phase = "after"
why = "The updater's module"
files = "apps/facthorygrid/src/main.rs"
find = "mod control_server;\n"
replace = "mod control_server;\nmod facthory_update;\n"
count = 1

[[rule]]
phase = "after"
why = "The updater starts with the app, in runs that keep preferences"
files = "apps/facthorygrid/src/main.rs"
find = "    app.watch_desktop_theme();\n"
replace = "    app.watch_desktop_theme();\n    facthory_update::start(\"Facthory Grid\", config_dir().filter(|_| prefs_enabled()));\n"
count = 1

[[rule]]
phase = "after"
why = "The updater's notice"
files = "apps/facthorygrid/src/main.rs"
find = "        self.1.show(&mut self.0, ui);\n"
replace = "        self.1.show(&mut self.0, ui);\n        facthory_update::ui(ui.ctx());\n"
count = 1

[[rule]]
phase = "after"
why = "A downloaded update installs as the app quits (on_exit runs on every way of quitting)"
files = "apps/facthorygrid/src/main.rs"
find = "        save_prefs(&self.0);\n"
replace = "        save_prefs(&self.0);\n        facthory_update::on_exit();\n"
count = 1

# ---------------------------------------------------------------------------------------------

[[copy]]
# Upstream's update window, without its updater (facthory/update/updates_ui.rs).
from = "update/updates_ui.rs"
to = "crates/ui-egui/src/updates_ui.rs"

[[copy]]
from = "ui/facthory_logo.rs"
to = "crates/ui-egui/src/facthory_logo.rs"

[[copy]]
from = "update/facthory_update.rs"
to = "apps/facthorygrid/src/facthory_update.rs"

[[copy]]
from = "icons/app-icon"
to = "assets/app-icon"
replace = true

[[rule]]
phase = "after"
why = "DMG window: 256 colours, not 16, so the chrome app icon's gradients do not band (the TIFF grows by a few KB)"
files = "packaging/macos/dmg/generate.py"
find = "PALETTE = 16  # colours in background.tiff"
replace = "PALETTE = 256  # colours in background.tiff"
count = 1

[[copy]]
# The DMG window: our colours, title and icon (the release workflow renders it with generate.py).
from = "dmg/background.svg"
to = "packaging/macos/dmg/background.svg"

[[copy]]
# Packages carry README.md (packaging copy_docs): ours, not upstream's.
from = "../.github/README.md"
to = "README.md"

# ---------------------------------------------------------------------------------------------
# `rebrand.py check`: no upstream mark in what ships, except the credits above.

[check]
paths = ["packaging", "assets", "apps/*/build.rs", "apps/*/index.html", "Cargo.toml", "omastore.toml"]
# Developer notes and scripts under packaging/ do not ship; app-build.rs.in is a one-time
# template already moved to apps/*/build.rs (docs/releasing.md).
exclude = ["*/tests/*", "*.png", "*.ico", "*.icns", "*.md", "*.py", "*.rs.in"]
# These also keep upstream's updater out: its feeds are its repositories (storytold/<app>) and
# its ids ai.storyteller.<app>, and it names the ArtCraft Launcher, so a build that links it
# again fails here (it did: craft-update, upstream releases of 2026-10).
forbid = [
  "artcraft", "gridcraft", "storytold", "storyteller", "getartcraft", "learning machines",
  "crafting apps", "photocraft", "vectorcraft", "filmcraft", "lightcraft", "pdfcraft",
  "effectcraft", "designcraft", "wordcraft", "deckcraft",
]
allow = [
  'Based on GridCraft by the ArtCraft team.',
  'Based on GridCraft, copyright (c) 2026 ArtCraft Team and the GridCraft contributors.',
  'based on GridCraft, copyright (c) the GridCraft authors.',
  # Build input used unmodified (Cargo git dependency), not a product surface.
  'https://github.com/storytold/craft-libs',
  # Upstream's forks of egui and winit (Cargo git dependencies), and the translations the
  # Flatpak recipe checks out: build inputs used unmodified.
  'https://github.com/storytold/egui.git',
  'https://github.com/storytold/winit.git',
  'https://github.com/storytold/craft-i18n',
  # A comment in Cargo.toml on where the craft-libs crates come from.
  'comes from one storytold/craft-libs revision',
  # The installer's policy check, shared by upstream's apps, names its siblings' ids (build time).
  "$policy.id -in 'deckcraft','filmcraft','soundcraft'",
]

# ---------------------------------------------------------------------------------------------
# facthory/sync.py: upstream files the patch set removed stay removed when a merge changes them.

[sync]
removed = [".github/dependabot.yml"]
