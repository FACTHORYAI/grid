# W6 fidelity corpus for Grid (.xlsx): draft manifest, generated 2026-10-25
# Every file is pinned by URL and SHA-256 and is NOT committed: fetch, verify, cache (bucket).
# licence/licence_url: git sources: the licence file at the pinned commit (read); public-sector entries: see their source/note for where the licence was read.
# producer: docProps/app.xml Application + AppVersion as read from the file.
# tier: smoke = 20 early picks under 1.5 MB with publish_renders = yes (cover most features; for the gate), full = the rest.
# producer is checked against traces only the Office apps write (Word w:rsids, Excel rupBuild, PowerPoint p14 or a 2007/2010 build).
# publish_renders: yes = renders/screenshots may go into public test reports; review = check content first.

